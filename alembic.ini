# Alembic yapılandırması — Borsa Bot
#
# URL ``env.py`` içinden ``app.config.settings`` veya ortam değişkenleri
# (``DATABASE_URL`` ya da ``DB_*``) üzerinden okunur. Aşağıdaki değer yalnızca
# fallback'tir.

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/borsa_bot

# Migration dosya adı şablonu (UTC tarih + revision + slug).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Yeni revision oluştururken zaman dilimini UTC sabitle.
timezone = UTC

[post_write_hooks]
# Tutarlı format için black + ruff (kurulduğunda otomatik koşar).
hooks = black,ruff
black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
