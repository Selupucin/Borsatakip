[tool.poetry]
name = "borsa-bot"
version = "0.1.0"
description = "BIST ve NYSE/NASDAQ borsalarını çoklu kaynaktan takip eden, teknik analiz + sentiment ile öneri üreten masaüstü uygulaması"
authors = ["Borsa Bot Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"

# UI (PySide6 — Qt6, LGPL, ticari kullanıma açık)
PySide6 = "^6.6"
pyqtgraph = "^0.13"
finplot = "^1.9"
pyqtdarktheme = "^2.1"
qt-material = "^2.14"
qtawesome = "^1.3"

# Veritabanı
SQLAlchemy = "^2.0"
alembic = "^1.13"
psycopg2-binary = "^2.9"
asyncpg = "^0.29"

# Veri
yfinance = "^0.2"
pandas-datareader = "^0.10"
alpha-vantage = "^2.3"
isyatirimhisse = "^4.0"
pandas = "^2.1"
numpy = "^2.0"
pyarrow = "^14.0"

# Teknik analiz & backtesting
TA-Lib = "^0.6"
pandas-ta = "^0.3"
vectorbt = "^0.26"

# Web scraping
playwright = "^1.40"
beautifulsoup4 = "^4.12"
tvdatafeed = "^2.0"
tradingview-ta = "^3.3"     # TradingView teknik özet (opsiyonel — yoksa NEUTRAL fallback)
finvizfinance = "^0.14"
feedparser = "^6.0"
aiohttp = "^3.9"
httpx = "^0.27"             # async REST (KAP, TCMB, Alpha Vantage, Investing fallback)

# NLP
transformers = "^4.36"
torch = "^2.1"
praw = "^7.7"

# Yardımcı
python-dotenv = "^1.0"
loguru = "^0.7"
pydantic = "^2.5"
pydantic-settings = "^2.1"
keyring = "^25.0"
cryptography = "^42.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.21"
pytest-mock = "^3.12"
pytest-cov = "^4.1"
aioresponses = "^0.7"
responses = "^0.24"
ruff = "^0.1"
black = "^23.0"
pre-commit = "^3.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# -----------------------------------------------------------------------------
# Tool ayarları
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks slow tests",
    "integration: requires real DB",
]
